<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>mkclash</title>
    <!-- KernelSU: request safe-drawing insets so the WebView pads itself instead of us. -->
    <link rel="stylesheet" type="text/css" href="/internal/insets.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f7f7f7;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            font-family: -apple-system, "MiSans", "Noto Sans CJK SC", sans-serif;
        }
        #compose-root { width: 100%; height: 100%; }
        #boot {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b8b8b;
            font-size: 15px;
        }
        @media (prefers-color-scheme: dark) {
            html, body { background: #000; }
            #boot { color: #6f6f6f; }
        }
    </style>
</head>
<body>
<div id="compose-root"></div>
<div id="boot">正在加载界面…</div>
<!-- The bundle <script> tag is injected by build.sh (keeps exactly one tag). -->
<script src="mihomo-ui.js"></script>
</body>
</html>
